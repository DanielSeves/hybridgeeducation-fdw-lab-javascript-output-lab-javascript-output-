<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 1 - Output en Javascript</title>
</head>
<body>
  <p id="texto"></p>
  <button id="btnActualizar">Actualizar texto</button>

  <script>
    document.getElementById('btnActualizar').addEventListener('click', function() {
      document.getElementById('texto').textContent = '¡Texto actualizado con Javascript!';
    });
  </script>
</body>
</html>
