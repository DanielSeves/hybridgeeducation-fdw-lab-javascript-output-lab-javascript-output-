<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demostración de Output en Javascript</title>
</head>
<body>
  <h1>Demostración de Output en Javascript</h1>

  <button id="btnAlerta">Mostrar alerta con mi nombre</button>

  <p id="texto2"></p>
  <button id="btnActualizar2">Actualizar texto</button>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      console.log('La página se ha cargado correctamente.');
    });

    document.getElementById('btnAlerta').addEventListener('click', function() {
      alert('Pablo Daniel');
    });

    document.getElementById('btnActualizar2').addEventListener('click', function() {
      document.getElementById('texto2').textContent = '¡Texto actualizado con Javascript!';
    });
  </script>
</body>
</html>
